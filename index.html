    toast('Clave borrada');
  };
}

// ===== face.js =====
// Rostro y cuerpo: detección con MediaPipe y deformación local de la imagen.

// Dónde están los modelos: en el archivo se cargan desde un CDN; en el artifact, desde sus propios archivos.
const FACE_BASE = 'https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh@0.4.1633559619/';
const POSE_BASE = 'https://cdn.jsdelivr.net/npm/@mediapipe/pose@0.5.1675469404/';
// En el artifact algunos archivos se renombran (su publicador no admite .binarypb ni .data).
const RENAME = FACE_BASE.startsWith('./') ? {
  'face_mesh.binarypb': 'face_mesh_graph.wasm',
  'face_mesh_solution_packed_assets.data': 'face_mesh_assets.wasm',
  'pose_web.binarypb': 'pose_graph.wasm',
  'pose_solution_packed_assets.data': 'pose_assets.wasm',
  'pose_landmark_full.tflite': 'pose_landmark_full.wasm',
} : {};
const fileName = (f) => RENAME[f] || f;

const loaded = {};
function loadScript(src) {
  if (!loaded[src]) {
    loaded[src] = new Promise((res, rej) => {
      const s = document.createElement('script');
      s.src = src;
      s.onload = res;
      s.onerror = () => { delete loaded[src]; rej(new Error('no cargó ' + src)); };
      document.head.appendChild(s);
    });
  }
  return loaded[src];
}

let faceMesh = null;
let pose = null;
// Una detección a la vez: MediaPipe no admite envíos concurrentes.
let queue = Promise.resolve();
const serial = (fn) => {
  const run = queue.then(fn, fn);
  queue = run.catch(() => {});
  return run;
};

async function getFaceMesh() {
  if (!faceMesh) {
    await loadScript(FACE_BASE + 'face_mesh.js');
    faceMesh = new window.FaceMesh({ locateFile: (f) => FACE_BASE + fileName(f) });
    faceMesh.setOptions({ maxNumFaces: 1, refineLandmarks: true, staticImageMode: true });
  }
  return faceMesh;
}
async function getPose() {
  if (!pose) {
    await loadScript(POSE_BASE + 'pose.js');
    pose = new window.Pose({ locateFile: (f) => POSE_BASE + fileName(f) });
    pose.setOptions({ modelComplexity: 1, staticImageMode: true });
  }
  return pose;
}

// Caché por imagen: no vuelve a detectar si la foto no cambió.
const cache = new WeakMap();
function detect(canvas, kind) {
  if (!cache.has(canvas)) cache.set(canvas, {});
  const c = cache.get(canvas);
  if (!c[kind]) {
    const small = scaled(canvas, 640);
    c[kind] = serial(async () => {
      const m = kind === 'face' ? await getFaceMesh() : await getPose();
      return new Promise((res, rej) => {
        m.onResults((r) => {
          if (kind === 'face') res(r.multiFaceLandmarks?.[0] ?? null);
          else res(r.poseLandmarks ?? null);
        });
        m.send({ image: small }).catch(rej);
      });
    }).catch((err) => {
      delete c[kind];
      throw err;
    });
  }
  return c[kind];
}

// ---------- deformación ----------
// effects: { t:'scale', cx, cy, rx, ry, ax, ay } o { t:'move', cx, cy, rx, ry, tx, ty }
// Ambos actúan dentro de una elipse y se desvanecen hacia el borde.
function applyEffect(e, dx, dy, w, h) {
  const x0 = Math.max(0, Math.floor(e.cx - e.rx));
  const x1 = Math.min(w - 1, Math.ceil(e.cx + e.rx));
  const y0 = Math.max(0, Math.floor(e.cy - e.ry));
  const y1 = Math.min(h - 1, Math.ceil(e.cy + e.ry));
  for (let y = y0; y <= y1; y++) {
    for (let x = x0; x <= x1; x++) {
      const ux = (x - e.cx) / e.rx;
      const uy = (y - e.cy) / e.ry;
      const d2 = ux * ux + uy * uy;
      if (d2 >= 1) continue;
      const wgt = (1 - d2) * (1 - d2);
      const i = y * w + x;
      if (e.t === 'scale') {
        dx[i] += -(x - e.cx) * e.ax * wgt;
        dy[i] += -(y - e.cy) * e.ay * wgt;
      } else {
        dx[i] -= e.tx * wgt;
        dy[i] -= e.ty * wgt;
      }
    }
  }
}

function warpPixels(d, w, h, effects) {
  if (!effects.length) return;
  const dx = new Float32Array(w * h);
  const dy = new Float32Array(w * h);
  for (const e of effects) applyEffect(e, dx, dy, w, h);
  const src = new Uint8ClampedArray(d);
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const i = y * w + x;
      let sx = x + dx[i];
      let sy = y + dy[i];
      sx = Math.min(w - 1, Math.max(0, sx));
      sy = Math.min(h - 1, Math.max(0, sy));
      const x0 = Math.floor(sx), y0 = Math.floor(sy);
      const x1 = Math.min(w - 1, x0 + 1), y1 = Math.min(h - 1, y0 + 1);
      const fx = sx - x0, fy = sy - y0;
      const p00 = (y0 * w + x0) * 4, p10 = (y0 * w + x1) * 4;
      const p01 = (y1 * w + x0) * 4, p11 = (y1 * w + x1) * 4;
      const o = i * 4;
      for (let c = 0; c < 3; c++) {
        const top = src[p00 + c] * (1 - fx) + src[p10 + c] * fx;
        const bot = src[p01 + c] * (1 - fx) + src[p11 + c] * fx;
        d[o + c] = top * (1 - fy) + bot * fy;
      }
      d[o + 3] = src[i * 4 + 3];
    }
  }
}

// ---------- puntos útiles ----------
const P = (m, i, w, h) => ({ x: m[i].x * w, y: m[i].y * h });
const M = (m, ids, w, h) => {
  const pts = ids.map((i) => P(m, i, w, h));
  return { x: pts.reduce((s, p) => s + p.x, 0) / pts.length, y: pts.reduce((s, p) => s + p.y, 0) / pts.length };
};
const D = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const sc = (cx, cy, rx, ry, ax, ay) => ({ t: 'scale', cx, cy, rx, ry, ax, ay });
const mv = (c, rx, ry, tx, ty) => ({ t: 'move', cx: c.x, cy: c.y, rx, ry, tx, ty });

// Cada herramienta devuelve sus efectos a partir de la intensidad a (-1..1).

// ---------- histograma (se actualiza con cada imagen que se muestra) ----------
function drawHistogram(canvas) {
  const cv = document.getElementById('histo');
  if (!cv || !canvas) return;
  const small = scaled(canvas, 160);
  const d = small.getContext('2d').getImageData(0, 0, small.width, small.height).data;
  const bins = new Uint32Array(256);
  for (let i = 0; i < d.length; i += 4) {
    const y = Math.round(0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2]);
    bins[y]++;
  }
  const max = Math.max(...bins) || 1;
  const g = cv.getContext('2d');
  g.clearRect(0, 0, cv.width, cv.height);
  g.fillStyle = 'rgba(255,255,255,0.75)';
  for (let x = 0; x < 256; x++) {
    const h = (bins[x] / max) * cv.height;
    g.fillRect(x, cv.height - h, 1, h);
  }
  // Marca las zonas donde se pierde detalle (sombras y luces cortadas).
  g.fillStyle = 'rgba(255,60,60,0.9)';
  if (bins[0] / small.width / small.height > 0.02) g.fillRect(0, 0, 2, cv.height);
  if (bins[255] / small.width / small.height > 0.02) g.fillRect(253, 0, 3, cv.height);
}
window.addEventListener('frame', (e) => drawHistogram(e.detail));

// ---------- recorte con rotación y perspectiva ----------
// Transformación inversa: cada píxel de salida busca su origen en la foto.
function cropTransform(src, p) {
  const W = src.width, H = src.height;
  const r = p.ratio || W / H;
  let ow, oh;
  if (W / H > r) { oh = H; ow = H * r; } else { ow = W; oh = W / r; }
  const z = 1 - (p.zoom / 100) * 0.5;
  ow = Math.max(2, Math.round(ow * z));
  oh = Math.max(2, Math.round(oh * z));
  const out = document.createElement('canvas');
  out.width = ow;
  out.height = oh;
  const sd = src.getContext('2d').getImageData(0, 0, W, H).data;
  const og = out.getContext('2d');
  const od = og.createImageData(ow, oh);
  const rad = -(p.rot || 0) * Math.PI / 180;
  const cos = Math.cos(rad), sin = Math.sin(rad);
  const kv = (p.kv || 0) / 100 * 0.6, kh = (p.kh || 0) / 100 * 0.6;
  for (let v = 0; v < oh; v++) {
    for (let u = 0; u < ow; u++) {
      let x = u - ow / 2, y = v - oh / 2;
      x *= 1 + kv * (y / (oh / 2));   // perspectiva vertical
      y *= 1 + kh * (x / (ow / 2));   // perspectiva horizontal
      const sx = x * cos - y * sin + W / 2;
      const sy = x * sin + y * cos + H / 2;
      const o = (v * ow + u) * 4;
      if (sx < 0 || sy < 0 || sx > W - 1 || sy > H - 1) {
        od.data[o + 3] = 255; // bordes vacíos: negro
        continue;
      }
      const x0 = Math.floor(sx), y0 = Math.floor(sy);
      const x1 = Math.min(W - 1, x0 + 1), y1 = Math.min(H - 1, y0 + 1);
      const fx = sx - x0, fy = sy - y0;
      const p00 = (y0 * W + x0) * 4, p10 = (y0 * W + x1) * 4, p01 = (y1 * W + x0) * 4, p11 = (y1 * W + x1) * 4;
      for (let c = 0; c < 3; c++) {
        const top = sd[p00 + c] * (1 - fx) + sd[p10 + c] * fx;
        const bot = sd[p01 + c] * (1 - fx) + sd[p11 + c] * fx;
        od.data[o + c] = top * (1 - fy) + bot * fy;
      }
      od.data[o + 3] = 255;
    }
  }
  og.putImageData(od, 0, 0);
  return out;
}

const RATIOS = [['Libre', 0], ['1:1', 1], ['3:4', 3 / 4], ['4:5', 4 / 5], ['16:9', 16 / 9]];

// ---------- reducir ruido (suavizado que respeta los bordes) ----------
function denoisePixels(d, w, h, amount, edge) {
  const blur = boxBlur(d, w, h, 2, 1);
  const thr = 4 + edge * 0.5;
  const k = amount / 100;
  for (let i = 0; i < d.length; i += 4) {
    for (let c = 0; c < 3; c++) {
      const diff = Math.abs(d[i + c] - blur[i + c]);
      const wgt = k * Math.max(0, 1 - diff / thr);
      d[i + c] = d[i + c] + (blur[i + c] - d[i + c]) * wgt;
    }
  }
}
function buildDenoise() {
  return {
    title: 'Reducir ruido',
    apply: true,
    focus: true,
    render(body) {
      body.innerHTML = sliderHTML('nr', 'Cantidad', 0, 100, 0, '%') + sliderHTML('edge', 'Proteger bordes', 0, 100, 50, '%')
        + '<p class="hint">Útil en fotos de noche o con poca luz. Protege los bordes para no borrar detalle.</p>';
      const run = () => {
        const p = readSliders(body);
        if (!p.nr) return clearPreview();
        previewCanvas(livePixels(current(), (d, w, h) => denoisePixels(d, w, h, p.nr, p.edge)));
      };
      bindSliders(body, schedule);
      st.live = run;
    },
  };
}

// ---------- piel por frecuencias: suaviza la mancha y conserva la textura fina ----------
function skinMask(d, w, h) {
  const m = new Float32Array(w * h);
  for (let i = 0, p = 0; i < d.length; i += 4, p++) {
    const r = d[i], g = d[i + 1], b = d[i + 2];
    const cb = 128 - 0.1687 * r - 0.3313 * g + 0.5 * b;
    const cr = 128 + 0.5 * r - 0.4187 * g - 0.0813 * b;
    m[p] = cb >= 77 && cb <= 127 && cr >= 133 && cr <= 173 ? 1 : 0;
  }
  return blurAlpha(m, w, h, 2);
}
function skinPixels(d, w, h, tex, str) {
  const mask = skinMask(d, w, h);
  const low = boxBlur(d, w, h, 6, 2);
  const out = new Uint8ClampedArray(d.length);
  for (let i = 0; i < d.length; i += 4) {
    for (let c = 0; c < 3; c++) {
      const L = low[i + c];
      const H = d[i + c] - L;
      out[i + c] = L + H * (1 - tex);
    }
    out[i + 3] = d[i + 3];
  }
  maskBlendPixels(d, out, mask.map((v) => v * str));
}
function buildSkin() {
  return {
    title: 'Piel',
    apply: true,
    focus: true,
    render(body) {
      body.innerHTML = sliderHTML('tex', 'Quitar manchas (conserva textura)', 0, 100, 0, '%')
        + sliderHTML('str', 'Intensidad sobre la piel', 0, 100, 60, '%')
        + '<p class="hint">Solo afecta a tonos de piel. La textura fina se conserva para que no se vea de plástico.</p>';
      const run = () => {
        const p = readSliders(body);
        if (!p.tex) return clearPreview();
        previewCanvas(livePixels(current(), (d, w, h) => skinPixels(d, w, h, p.tex / 100, p.str / 100)));
      };
      bindSliders(body, schedule);
      st.live = run;
    },
  };
}

const PRESET_KEYS = [['exp', 'Exposición', -100, 100], ['c', 'Contraste', -100, 100], ['hi', 'Luces', -100, 100], ['s', 'Saturación', -100, 100], ['vib', 'Vibrancia', -100, 100], ['temp', 'Temperatura', -100, 100], ['clar', 'Claridad', 0, 100], ['sharp', 'Nitidez', 0, 100], ['grain', 'Grano', 0, 100]];
const PRESET_STORE = 'fotos-ia:presets';
function loadPresets() {
  try { return JSON.parse(localStorage.getItem(PRESET_STORE) || '{}'); } catch { return {}; }
}
function savePresets(o) {
  try { localStorage.setItem(PRESET_STORE, JSON.stringify(o)); } catch { toast('No pude guardar el preset en este navegador'); }
}
function buildPresets() {
  return {
    title: 'Presets',
    apply: true,
    focus: true,
    render(body) {
      const list = loadPresets();
      body.innerHTML = `
        ${PRESET_KEYS.map(([k, l, mn, mx]) => sliderHTML(k, l, mn, mx, 0, '')).join('')}
        <div class="btn-row"><input class="input" id="pName" placeholder="Nombre del preset"><button class="btn" id="pSave">Guardar</button></div>
        <div class="chips" id="pList">${Object.keys(list).map((n) => `<button class="chip" data-p="${n}">${n}</button><button class="chip ghost" data-del="${n}">×</button>`).join('') || '<span class="hint">Aún no hay presets.</span>'}</div>
        <p class="hint">Mueve los deslizadores para crear un ajuste, guárdalo con un nombre y úsalo cuando quieras. Se guardan en este navegador.</p>`;
      const run = () => {
        const p = readSliders(body);
        const nothing = PRESET_KEYS.every(([k]) => !p[k]);
        if (nothing) return clearPreview();
        previewCanvas(mapPixels(scaled(current(), 800), (d, w, h) => editPixels(d, w, h, p)));
        st.finalize = () => mapPixels(current(), (d, w, h) => editPixels(d, w, h, p));
      };
      bindSliders(body, () => schedule());
      st.live = run;
      // Cargar un preset: pone sus valores en los deslizadores y lo muestra.
      body.querySelectorAll('[data-p]').forEach((b) => {
        b.onclick = () => {
          const p = list[b.dataset.p];
          PRESET_KEYS.forEach(([k]) => {
            const input = body.querySelector(`input[data-k="${k}"]`);
            if (!input) return;
            input.value = p[k] ?? 0;
            input.closest('.field').querySelector('output').textContent = input.value;
          });
          run();
        };
      });
      body.querySelectorAll('[data-del]').forEach((b) => {
        b.onclick = () => {
          const o = loadPresets();
          delete o[b.dataset.del];
          savePresets(o);
          buildPresets().render(body);
        };
      });
      body.querySelector('#pSave').onclick = () => {
        const name = body.querySelector('#pName').value.trim();
        if (!name) return toast('Ponle un nombre al preset');
        const o = loadPresets();
        o[name] = { ...readSliders(body) };
        savePresets(o);
        toast('Preset guardado');
        buildPresets().render(body);
      };
    },
  };
}

// Foto de documento: recorte 3:4 centrado con fondo blanco.
function buildIdPhoto() {
  return {
    title: 'Foto ID',
    apply: false,
    render(body) {
      body.innerHTML = `
        <p class="hint">Recorta la foto a 3:4 con fondo blanco. Centra tu rostro antes de crearla.</p>
        <button class="btn primary big" id="idGo">Crear foto de documento</button>`;
      body.querySelector('#idGo').onclick = () => {
        const src = current();
        const W = 600, H = 800;
        const c = document.createElement('canvas');
        c.width = W;
        c.height = H;
        const g = c.getContext('2d');
        g.fillStyle = '#ffffff';
        g.fillRect(0, 0, W, H);
        const s = Math.max(W / src.width, H / src.height);
        const dw = src.width * s;
        const dh = src.height * s;
        g.drawImage(src, (W - dw) / 2, (H - dh) / 2, dw, dh);
        commit(c);
        resetSheet();
        toast('Foto de documento lista. Toca ↶ si quieres deshacer.', 3500);
      };
    },
  };
}

// Inicio, cámara y barras.
function setupHome(install) {
  const showHome = () => {
    resetSheet();
    el.workspace.hidden = true;
    el.empty.hidden = false;
  };
  el.empty.querySelectorAll('[data-open]').forEach((b) => {
    b.onclick = () => {
      if (!current()) {
        el.file.click();
        st.pendingPanel = b.dataset.open;
        return;
      }
      el.workspace.hidden = false;
      el.empty.hidden = true;
      go(b.dataset.open);
    };
  });
  const camera = () => document.getElementById('cameraInput').click();
  document.getElementById('btnCamera').onclick = camera;
  document.getElementById('btnCamera2').onclick = camera;
  document.getElementById('cameraInput').onchange = (e) => {
    const f = e.target.files?.[0];
    e.target.value = '';
    if (f) loadFile(f);
  };
  document.getElementById('btnHome').onclick = showHome;
  el.empty.querySelector('[data-home="inicio"]').onclick = showHome;
  document.getElementById('btnInstallNav').onclick = () => {
    if (install) install();
    else toast('Abre el menú de tu navegador para instalar la app');
  };
  // Al elegir una foto con un menú pendiente, se abre ese menú.
  el.file.addEventListener('change', () => {
    setTimeout(() => {
      if (st.pendingPanel && current()) {
        const k = st.pendingPanel;
        st.pendingPanel = null;
        go(k);
      }
    }, 400);
  });
}

// ===== app.js =====
// Arranque de la app: eventos, pinceles (zonas para IA y clonar), pestañas, actualizaciones y foto compartida.






const PANELS = {
  ...WARP_PANELS,
  ...PRO_PANELS,
  editar: buildEditar,
  belleza: buildBelleza,
  idphoto: buildIdPhoto,
  luz: buildLight,
  color: buildColor,
  niveles: buildLevels,
  local: buildLocal,
  hsl: buildHSL,
  detalle: buildDetail,
  filtros: buildFilters,
  girar: buildTransform,
  retoque: buildRetouch,
  borrar: buildRemove,
  texto: buildText,
  textoedit: buildTextEdit,
  marco: buildFrame,
  ia: buildAI,
};

// ---------- pinceles: marcar zonas (IA) y clonar (quitar manchas) ----------
function setupPainting() {
  let drawing = false;
  let last = null;
  let source = null; // foto antes del trazo (fuente del clon)
  let work = null;   // copia donde se pinta el clon
  let delta = null;  // desplazamiento entre origen y pincel
  let radius = 0;
  let rectStart = null; // selección de área: punto inicial
  let rectEnd = null;   // selección de área: punto actual
  let rectDrawing = false;

  const toImage = (e) => {
    const r = el.overlay.getBoundingClientRect();
    const cw = el.overlay.width;
    const ch = el.overlay.height;
    const s = Math.min(r.width / cw, r.height / ch);
    const ox = (r.width - cw * s) / 2;
    const oy = (r.height - ch * s) / 2;
    return { x: (e.clientX - r.left - ox) / s, y: (e.clientY - r.top - oy) / s };
  };

  const brushPx = () => Math.max(4, (el.overlay.width * st.brush.size) / 100);

  const maskStyle = () => {
    overlayCtx.strokeStyle = 'rgba(255, 45, 45, 0.85)';
    overlayCtx.fillStyle = 'rgba(255, 45, 45, 0.85)';
    overlayCtx.lineCap = 'round';
    overlayCtx.lineJoin = 'round';
    overlayCtx.lineWidth = brushPx();
  };

  // Círculo punteado que marca el origen del clon.
  const drawOrigin = (p) => {
    overlayCtx.clearRect(0, 0, el.overlay.width, el.overlay.height);
    overlayCtx.lineWidth = 3;
    overlayCtx.strokeStyle = '#ffffff';
    overlayCtx.setLineDash([8, 6]);
    overlayCtx.beginPath();
    overlayCtx.arc(p.x, p.y, radius, 0, Math.PI * 2);
    overlayCtx.stroke();
    overlayCtx.setLineDash([]);
  };

  const stampAt = (x, y) => {
    const ctx = work.getContext('2d');
    ctx.save();
    ctx.beginPath();
    ctx.arc(x, y, radius, 0, Math.PI * 2);
    ctx.clip();
    ctx.drawImage(
      source,
      x + delta.dx - radius, y + delta.dy - radius, radius * 2, radius * 2,
      x - radius, y - radius, radius * 2, radius * 2,
    );
    ctx.restore();
  };

  // Sella puntos a lo largo del trazo para que no queden huecos al mover rápido.
  const cloneTo = (p) => {
    const dist = Math.hypot(p.x - last.x, p.y - last.y);
    const steps = Math.max(1, Math.ceil(dist / Math.max(1, radius / 3)));
    for (let i = 1; i <= steps; i++) {
      const t = i / steps;
      stampAt(last.x + (p.x - last.x) * t, last.y + (p.y - last.y) * t);
    }
    last = p;
    show(work);
  };

  el.overlay.addEventListener('pointerdown', (e) => {
    if (st.rectMode) {
      e.preventDefault();
      el.overlay.setPointerCapture(e.pointerId);
      rectStart = rectEnd = toImage(e);
      rectDrawing = true;
      return;
    }
    if (st.clone.on) {
      e.preventDefault();
      radius = brushPx() / 2;
      const p = toImage(e);
      if (st.clone.picking || !st.clone.origin) {
        st.clone.origin = p;
        st.clone.picking = false;
        drawOrigin(p);
        return;
      }
      el.overlay.setPointerCapture(e.pointerId);
      drawing = true;
      source = current();
      work = cloneCanvas(source);
      delta = { dx: st.clone.origin.x - p.x, dy: st.clone.origin.y - p.y };
      overlayCtx.clearRect(0, 0, el.overlay.width, el.overlay.height);
      last = p;
      stampAt(p.x, p.y);
      show(work);
      return;
    }
    if (!st.brush.on) return;
    e.preventDefault();
    el.overlay.setPointerCapture(e.pointerId);
    drawing = true;
    maskStyle();
    last = toImage(e);
    overlayCtx.beginPath();
    overlayCtx.arc(last.x, last.y, overlayCtx.lineWidth / 2, 0, Math.PI * 2);
    overlayCtx.fill();
    st.brush.marked = true;
  });

  el.overlay.addEventListener('pointermove', (e) => {
    if (rectDrawing) {
      rectEnd = toImage(e);
      drawRegion(normRect(rectStart, rectEnd));
      return;
    }
    if (!drawing) return;
    const p = toImage(e);
    if (st.clone.on) return cloneTo(p);
    overlayCtx.beginPath();
    overlayCtx.moveTo(last.x, last.y);
    overlayCtx.lineTo(p.x, p.y);
    overlayCtx.stroke();
    last = p;
  });

  const stop = () => {
    if (rectDrawing) {
      rectDrawing = false;
      const r = normRect(rectStart, rectEnd);
      const ok = r.w > 6 && r.h > 6;
      const cb = st.onRect;
      setPaintMode(null);
      drawRegion(ok ? r : null);
      cb?.(ok ? r : null);
      return;
    }
    if (drawing && work) commit(work); // fin de un trazo de clonar
    if (drawing && st.panelKey === 'local') schedule(); // trazo de zona: actualiza la vista previa
    drawing = false;
    work = null;
    source = null;
  };
  el.overlay.addEventListener('pointerup', stop);
  el.overlay.addEventListener('pointercancel', stop);
}

// ---------- deslizar en la foto: cambia de herramienta (como en Samsung) ----------
function setupSwipe() {
  const box = document.querySelector('.canvas-box');
  const order = [...document.querySelectorAll('#tabs button[data-tab]')].map((b) => b.dataset.tab);
  let sx = null;
  let sy = 0;
  box.addEventListener('pointerdown', (e) => {
    if (st.brush.on || st.clone.on || st.rectMode) return;
    sx = e.clientX;
    sy = e.clientY;
  });
  box.addEventListener('pointerup', (e) => {
    if (sx === null) return;
    const dx = e.clientX - sx;
    const dy = e.clientY - sy;
    sx = null;
    if (Math.abs(dx) < 70 || Math.abs(dy) > 50 || !st.panelKey) return;
    const i = order.indexOf(st.panelKey);
    const next = order[dx < 0 ? i + 1 : i - 1];
    if (next) openPanel(next, PANELS[next]);
  });
  box.addEventListener('pointercancel', () => { sx = null; });
}

// ---------- arranque ----------
function init() {
  el.pick.onclick = () => el.file.click();
  el.newPhoto.onclick = () => el.file.click();
  el.file.onchange = (e) => {
    const f = e.target.files?.[0];
    e.target.value = '';
    if (f) loadFile(f);
  };

  el.undo.onclick = undo;
  el.redo.onclick = redo;
  el.save.onclick = openExport;
  el.key.onclick = () => openKeyPanel();
  el.sheetCancel.onclick = resetSheet;
  el.sheetApply.onclick = applyPending;
  el.sheetPeek.onclick = () => {
    const peek = el.sheet.classList.toggle('peek');
    el.sheetPeek.textContent = peek ? 'Controles' : 'Ver foto';
  };

  // Mantener presionado para ver la versión anterior
  el.compare.addEventListener('pointerdown', (e) => {
    if (!current()) return;
    el.compare.setPointerCapture(e.pointerId);
    show(current());
  });
  const restore = () => {
    if (st.preview) show(st.preview);
    else if (current()) show(current());
  };
  el.compare.addEventListener('pointerup', restore);
  el.compare.addEventListener('pointercancel', restore);

  el.tabs.addEventListener('click', (e) => {
    const b = e.target.closest('button[data-tab]');
    if (!b) return;
    if (st.panelKey === b.dataset.tab) {
      // Si el panel está oculto (para ver la foto), la pestaña lo vuelve a mostrar.
      if (el.sheet.hidden) {
        el.sheet.hidden = false;
        return;
      }
      return resetSheet();
    }
    openPanel(b.dataset.tab, PANELS[b.dataset.tab]);
  });

  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    st.deferredInstall = e;
    el.install.hidden = false;
  });
  el.install.onclick = async () => {
    if (!st.deferredInstall) return;
    st.deferredInstall.prompt();
    await st.deferredInstall.userChoice;
    st.deferredInstall = null;
    el.install.hidden = true;
  };

  setRegistry(PANELS);
  setupHome(() => (st.deferredInstall ? (st.deferredInstall.prompt(), st.deferredInstall = null) : null));
  setupPainting();
  setupSwipe();
  refreshButtons();
}

init();
